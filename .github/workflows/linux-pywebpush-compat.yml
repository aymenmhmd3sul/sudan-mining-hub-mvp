name: Linux pywebpush Compatibility

on:
  push:
    branches:
      - test/linux-pywebpush-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Verify pywebpush and cryptography on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebpush

      - name: Verify imports and P-256 cryptography
        run: |
          python - <<'PY'
          import cryptography
          import pywebpush
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec

          private_key = ec.generate_private_key(ec.SECP256R1())
          message = b"smh-linux-pywebpush-compat"
          signature = private_key.sign(
              message,
              ec.ECDSA(hashes.SHA256()),
          )
          private_key.public_key().verify(
              signature,
              message,
              ec.ECDSA(hashes.SHA256()),
          )

          print("CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          print("PYWEBPUSH_IMPORT=PASS")
          print("P256_KEY_GENERATION=PASS")
          print("ECDSA_SIGN_VERIFY=PASS")
          PY
