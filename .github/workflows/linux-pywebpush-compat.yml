name: Linux Web Push Service Isolated Test

on:
  push:
    branches:
      - test/linux-pywebpush-compat
      - test/linux-web-push-service
    paths:
      - .github/workflows/linux-pywebpush-compat.yml
      - app/core/config.py
      - app/db/base.py
      - app/models/push_subscription.py
      - app/routers/ui.py
      - app/services/notification_service.py
      - migrations/env.py
      - migrations/versions/push_subscriptions_20261011.py
      - migrations/versions/notification_read_state_20261012.py
      - requirements.txt
      - tests/test_negotiation_message_notifications_isolated.py
      - tests/test_web_push_service_isolated.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Verify Isolated Web Push and Negotiation Notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/testdb
      SECRET_KEY: isolated-test-only-not-a-real-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify P-256 cryptography
        run: |
          python - <<'PY'
          import cryptography
          import pywebpush
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec

          private_key = ec.generate_private_key(ec.SECP256R1())
          message = b"smh-linux-pywebpush-compat"
          signature = private_key.sign(
              message,
              ec.ECDSA(hashes.SHA256()),
          )
          private_key.public_key().verify(
              signature,
              message,
              ec.ECDSA(hashes.SHA256()),
          )

          print("CRYPTOGRAPHY_VERSION=" + cryptography.__version__)
          print("PYWEBPUSH_IMPORT=PASS")
          print("P256_KEY_GENERATION=PASS")
          print("ECDSA_SIGN_VERIFY=PASS")
          PY

      - name: Test isolated negotiation notifications
        run: python -m pytest -q tests/test_negotiation_message_notifications_isolated.py

      - name: Test isolated Web Push service
        run: python -m pytest -q tests/test_web_push_service_isolated.py
