{% extends "base/base.html" %}

{% block content %}
<main class="gateway">

  <header class="gateway-header">
    <div class="brand">
      <div class="brand-mark">SMH</div>

      <div class="brand-copy">
        <strong>{{ t("app.name") }}</strong>
        <span data-i18n="gateway.tagline">
          {{ t("gateway.tagline") }}
        </span>
      </div>
    </div>

    <button
      id="languageToggle"
      class="language-toggle"
      type="button"
      aria-label="Change language"
    >
      <span id="languageLabel">
        {% if lang == "ar" %}EN{% else %}العربية{% endif %}
      </span>
    </button>
  </header>


  <section class="gateway-hero">

    <div class="hero-orbit hero-orbit-one"></div>
    <div class="hero-orbit hero-orbit-two"></div>

    <div class="hero-content">

      <div class="hero-kicker">
        <span class="hero-dot"></span>
        <span data-i18n="gateway.eyebrow">
          {{ t("gateway.eyebrow") }}
        </span>
      </div>

      <h1 data-i18n="gateway.title">
        {{ t("gateway.title") }}
      </h1>

      <p data-i18n="gateway.description">
        {{ t("gateway.description") }}
      </p>

      <div class="hero-actions">
        <button
          id="exploreBtn"
          class="btn btn-primary"
          type="button"
        >
          <span data-i18n="gateway.explore">
            {{ t("gateway.explore") }}
          </span>
          <span class="btn-arrow">↗</span>
        </button>

        <button
          id="loginBtn"
          class="btn btn-secondary"
          type="button"
        >
          <span data-i18n="gateway.login">
            {{ t("gateway.login") }}
          </span>
        </button>

            <button
                id="registerBtn"
                class="btn btn-secondary"
                type="button"
            >
                <span data-i18n="gateway.register">
                    {{ t("gateway.register") }}
                </span>
            </button>
      </div>

    </div>


    <div class="hero-emblem" aria-hidden="true">
      <div class="emblem-ring emblem-ring-outer"></div>
      <div class="emblem-ring emblem-ring-inner"></div>
      <div class="emblem-core">
        <span>Au</span>
        <small>SMH</small>
      </div>
    </div>

  </section>


  <section
    id="gatewayModules"
    class="gateway-modules"
    aria-label="Platform modules"
  >

    <button
      class="module-card module-card-main"
      data-module="marketplace"
      type="button"
    >
      <span class="module-top">
        <span class="module-icon">01</span>
        <span class="module-arrow">↗</span>
      </span>

      <span class="module-content">
        <strong data-i18n="modules.marketplace.title">
          {{ t("modules.marketplace.title") }}
        </strong>

        <span data-i18n="modules.marketplace.description">
          {{ t("modules.marketplace.description") }}
        </span>
      </span>
    </button>


    <button
      class="module-card"
      data-module="requests"
      type="button"
    >
      <span class="module-top">
        <span class="module-icon">02</span>
        <span class="module-arrow">↗</span>
      </span>

      <span class="module-content">
        <strong data-i18n="modules.requests.title">
          {{ t("modules.requests.title") }}
        </strong>

        <span data-i18n="modules.requests.description">
          {{ t("modules.requests.description") }}
        </span>
      </span>
    </button>


    <button
      class="module-card"
      data-module="negotiation"
      type="button"
    >
      <span class="module-top">
        <span class="module-icon">03</span>
        <span class="module-arrow">↗</span>
      </span>

      <span class="module-content">
        <strong data-i18n="modules.negotiation.title">
          {{ t("modules.negotiation.title") }}
        </strong>

        <span data-i18n="modules.negotiation.description">
          {{ t("modules.negotiation.description") }}
        </span>
      </span>
    </button>


    <button
      class="module-card"
      data-module="services"
      type="button"
    >
      <span class="module-top">
        <span class="module-icon">04</span>
        <span class="module-arrow">↗</span>
      </span>

      <span class="module-content">
        <strong data-i18n="modules.services.title">
          {{ t("modules.services.title") }}
        </strong>

        <span data-i18n="modules.services.description">
          {{ t("modules.services.description") }}
        </span>
      </span>
    </button>

  </section>


  <section
    id="gatewayStatus"
    class="gateway-status"
    aria-live="polite"
    hidden
  >
  </section>

</main>
{% endblock %}
