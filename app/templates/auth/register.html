{% extends "base/base.html" %}

{% block content %}
<main class="gateway">
<section class="gateway-hero">
<div class="hero-content">
<span class="eyebrow">{{ t("pages.register.eyebrow") }}</span>
<h1>{{ t("pages.register.title") }}</h1>
<p>{{ t("pages.register.description") }}</p>

<form id="registerForm" class="login-form">
<label for="registerName">{{ t("auth.full_name") }}</label>
<input id="registerName" name="full_name" type="text" autocomplete="name"
       placeholder="{{ t('auth.full_name_placeholder') }}">

<label for="registerEmail">{{ t("auth.email") }}</label>
<input id="registerEmail" name="email" type="email" autocomplete="email"
       required placeholder="example@email.com">

<label for="registerPhone">{{ t("auth.phone_number") }}</label>
<input id="registerPhone" name="phone_number" type="tel" autocomplete="tel"
       placeholder="{{ t('auth.phone_placeholder') }}">

<label for="registerRole">{{ t("auth.role") }}</label>
<select id="registerRole" name="role" required>
<option value="BUYER">{{ t("auth.role_buyer") }}</option>
<option value="MERCHANT">{{ t("auth.role_merchant") }}</option>
<option value="AGENT">{{ t("auth.role_agent") }}</option>
</select>

<label for="registerPassword">{{ t("auth.password") }}</label>
<div class="password-field">
<input id="registerPassword" name="password" type="password"
       autocomplete="new-password" required minlength="6">
<button type="button" id="togglePassword" class="password-toggle"
        aria-label="{{ t('auth.show_password') }}">👁</button>
</div>

<div id="registerStatus" class="login-status" role="status" aria-live="polite"></div>

<button type="submit" id="registerSubmit" class="btn btn-primary">
{{ t("auth.register") }}
</button>
</form>

<div class="hero-actions">
<a class="btn btn-secondary" href="/login">{{ t("auth.have_account") }}</a>
<a class="btn btn-secondary" href="/">{{ t("common.back_to_gateway") }}</a>
</div>
</div>
</section>
</main>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("registerForm");
    const name = document.getElementById("registerName");
    const email = document.getElementById("registerEmail");
    const phone = document.getElementById("registerPhone");
    const role = document.getElementById("registerRole");
    const password = document.getElementById("registerPassword");
    const toggle = document.getElementById("togglePassword");
    const status = document.getElementById("registerStatus");
    const submit = document.getElementById("registerSubmit");

    toggle.addEventListener("click", function () {
        const visible = password.type === "text";
        password.type = visible ? "password" : "text";
        toggle.textContent = visible ? "👁" : "🙈";
        toggle.setAttribute(
            "aria-label",
            visible
                ? "{{ t('auth.show_password') }}"
                : "{{ t('auth.hide_password') }}"
        );
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        status.textContent = "{{ t('auth.registering') }}";
        submit.disabled = true;

        try {
            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    email: email.value.trim(),
                    password: password.value,
                    full_name: name.value.trim() || null,
                    phone_number: phone.value.trim() || null,
                    role: role.value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "{{ t('auth.registration_failed') }}"
                );
            }

            status.textContent = "{{ t('auth.registration_success') }}";
            submit.disabled = true;

            setTimeout(function () {
                window.location.href = "/login";
            }, 700);
        } catch (error) {
            status.textContent = error.message;
            submit.disabled = false;
        }
    });
});
</script>
{% endblock %}
