<!DOCTYPE html>
<html lang="{{ lang | default('ar') }}" dir="{{ dir | default('rtl') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ffffff">

    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icons/icon-192.png') }}">

    <script>
        try {
            const appearance = JSON.parse(localStorage.getItem("smh_appearance") || "{}");
            document.documentElement.dataset.theme = appearance.theme === "dark" ? "dark" : "light";
        } catch (error) {
            document.documentElement.dataset.theme = "light";
        }
    </script>

    <title>{{ title | default("Sudan Mining Hub") }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/app.css') }}?v=20261019-appearance-position"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/notifications.css') }}?v=20261020-notifications-layer"
    >
</head>

<body>
    <div
        id="smh-notifications"
        data-unread="{{ t('notifications.unread') }}"
        data-empty="{{ t('notifications.empty') }}"
        data-read-all="{{ t('notifications.read_all') }}"
        data-error="{{ t('notifications.error') }}"
        data-close="{{ t('notifications.close') }}"
        data-push-enable="{{ t('notifications.enable_push') }}"
        data-push-enabled="{{ t('notifications.push_enabled') }}"
        data-push-denied="{{ t('notifications.push_denied') }}"
        data-push-blocked="{{ t('notifications.push_blocked') }}"
        data-push-blocked-help="{{ t('notifications.push_blocked_help') }}"
        data-push-unavailable="{{ t('notifications.push_unavailable') }}"
        data-push-unsupported="{{ t('notifications.push_unsupported') }}"
        hidden
    >
        <button
            type="button"
            id="smh-notifications-toggle"
            aria-expanded="false"
            aria-controls="smh-notifications-panel"
        >
            {{ t("notifications.button") }}
            <span id="smh-notifications-count" aria-live="polite"></span>
        </button>

        <section id="smh-notifications-panel" hidden>
            <div class="smh-notifications-heading">
                <h2>{{ t("notifications.title") }}</h2>
                <button type="button" id="smh-notifications-read-all">
                    {{ t("notifications.read_all") }}
                </button>
            </div>
            <button type="button" id="smh-notifications-enable-push">
                {{ t("notifications.enable_push") }}
            </button>
            <div id="smh-notifications-list"></div>
            <p id="smh-notifications-empty" hidden>{{ t("notifications.empty") }}</p>
        </section>
    </div>

    <div id="smh-notification-toast" role="status" aria-live="polite" hidden>
        <strong id="smh-notification-toast-title"></strong>
        <span id="smh-notification-toast-message"></span>
    </div>
    <div id="smh-appearance-root" class="smh-appearance">
        <button
            type="button"
            id="smh-appearance-toggle"
            class="smh-appearance-toggle"
            aria-expanded="false"
            aria-controls="smh-appearance-panel"
        >
            {{ t("appearance.button") }}
        </button>

        <section
            id="smh-appearance-panel"
            class="smh-appearance-panel"
            hidden
            aria-label="{{ t('appearance.title') }}"
        >
            <div class="smh-appearance-title">{{ t("appearance.title") }}</div>

            <div class="smh-appearance-group">
                <div class="smh-appearance-label">{{ t("appearance.theme") }}</div>
                <div class="smh-appearance-options" role="group" aria-label="{{ t('appearance.theme') }}">
                    <button type="button" data-appearance-theme="light">{{ t("appearance.theme_light") }}</button>
                    <button type="button" data-appearance-theme="dark">{{ t("appearance.theme_dark") }}</button>
                </div>
            </div>

            <div class="smh-appearance-group">
                <div class="smh-appearance-label">{{ t("appearance.font_size") }}</div>
                <div class="smh-appearance-options" role="group" aria-label="{{ t('appearance.font_size') }}">
                    <button type="button" data-appearance-font-size="small">{{ t("appearance.font_size_small") }}</button>
                    <button type="button" data-appearance-font-size="normal">{{ t("appearance.font_size_normal") }}</button>
                    <button type="button" data-appearance-font-size="large">{{ t("appearance.font_size_large") }}</button>
                </div>
            </div>

            <div class="smh-appearance-group">
                <div class="smh-appearance-label">{{ t("appearance.font") }}</div>
                <div class="smh-appearance-options" role="group" aria-label="{{ t('appearance.font') }}">
                    <button type="button" data-appearance-font="system">{{ t("appearance.font_system") }}</button>
                    <button type="button" data-appearance-font="readable">{{ t("appearance.font_readable") }}</button>
                    <button type="button" data-appearance-font="serif">{{ t("appearance.font_serif") }}</button>
                </div>
            </div>

            <div class="smh-appearance-group">
                <div class="smh-appearance-label">{{ t("appearance.contrast") }}</div>
                <div class="smh-appearance-options" role="group" aria-label="{{ t('appearance.contrast') }}">
                    <button type="button" data-appearance-contrast="normal">{{ t("appearance.contrast_normal") }}</button>
                    <button type="button" data-appearance-contrast="high">{{ t("appearance.contrast_high") }}</button>
                </div>
            </div>

            <button
                type="button"
                id="smh-appearance-reset"
                class="smh-appearance-reset"
            >
                {{ t("appearance.reset") }}
            </button>
        </section>
    </div>

    <div id="app-shell">
        {% block content %}{% endblock %}
    </div>

    <script
        src="{{ url_for('static', path='js/appearance.js') }}"
        defer
    ></script>

    <script
        src="{{ url_for('static', path='js/app.js') }}"
        defer
    ></script>

    <script
        src="{{ url_for('static', path='js/notifications.js') }}?v=20261020-visitor-button"
        defer
    ></script>

    {% block scripts %}{% endblock %}
</body>
</html>
